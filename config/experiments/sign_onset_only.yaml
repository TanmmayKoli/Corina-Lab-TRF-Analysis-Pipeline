# Experiment: Sign onset alone (ELAN-derived)
# Can raw sign boundaries predict EEG without any motion features?
name: sign_onset_only

regressors:
  - sign_onset
  - sign_offset

trf:
  tmin: 0.0
  tmax: 0.5
  backend: ridge
  alpha: 100000.0

evaluation:
  scheme: blocked
  folds: leave_one_presentation_out
